<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
  </defs>

  <rect width="900" height="550" rx="16" fill="url(#archBg)" stroke="#334155" stroke-width="1.5"/>

  <text x="450" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="1">CYBERNEX FULL-STACK ARCHITECTURE</text>

  <g font-family="system-ui, sans-serif" font-size="12" font-weight="700">
    <!-- Layer 1: Presentation Layer -->
    <rect x="50" y="80" width="800" height="90" rx="12" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="70" y="105" fill="#38bdf8" font-size="11">PRESENTATION LAYER (REACT 18 + TAILWIND CSS)</text>
    
    <rect x="70" y="115" width="170" height="40" rx="8" fill="#0284c7" text-anchor="middle"/>
    <text x="155" y="140" fill="#ffffff" text-anchor="middle">Task Composer</text>

    <rect x="260" y="115" width="170" height="40" rx="8" fill="#0284c7" text-anchor="middle"/>
    <text x="345" y="140" fill="#ffffff" text-anchor="middle">Execution Console</text>

    <rect x="450" y="115" width="170" height="40" rx="8" fill="#0284c7" text-anchor="middle"/>
    <text x="535" y="140" fill="#ffffff" text-anchor="middle">RAG Knowledge Base</text>

    <rect x="640" y="115" width="190" height="40" rx="8" fill="#0284c7" text-anchor="middle"/>
    <text x="735" y="140" fill="#ffffff" text-anchor="middle">Security &amp; Hardware Telemetry</text>

    <!-- Connector 1 -->
    <path d="M 450 170 L 450 200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>

    <!-- Layer 2: API & Orchestration Layer -->
    <rect x="50" y="200" width="800" height="120" rx="12" fill="url(#cardGrad)" stroke="#0369a1" stroke-width="1.5"/>
    <text x="70" y="225" fill="#38bdf8" font-size="11">APPLICATION &amp; AGENTIC ORCHESTRATION LAYER (FASTAPI + LANGGRAPH)</text>

    <rect x="70" y="240" width="220" height="60" rx="8" fill="#0f172a" stroke="#0284c7"/>
    <text x="180" y="265" fill="#f8fafc" text-anchor="middle">FastAPI REST / SSE Server</text>
    <text x="180" y="285" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">/api/v1 Endpoints</text>

    <rect x="320" y="240" width="240" height="60" rx="8" fill="#0f172a" stroke="#0284c7"/>
    <text x="440" y="265" fill="#f8fafc" text-anchor="middle">LangGraph Agent Pipeline</text>
    <text x="440" y="285" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">12-Step Graph Orchestration</text>

    <rect x="590" y="240" width="240" height="60" rx="8" fill="#0f172a" stroke="#0284c7"/>
    <text x="710" y="265" fill="#f8fafc" text-anchor="middle">Model Router (Auto)</text>
    <text x="710" y="285" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">General / Coding / Vision</text>

    <!-- Connector 2 -->
    <path d="M 450 320 L 450 350" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>

    <!-- Layer 3: Sovereign Engine & Tooling Layer -->
    <rect x="50" y="350" width="800" height="150" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="375" fill="#38bdf8" font-size="11">SOVEREIGN ENGINES &amp; LOCAL TOOLING LAYER</text>

    <rect x="70" y="390" width="170" height="90" rx="8" fill="#0f172a" stroke="#38bdf8"/>
    <text x="155" y="420" fill="#f8fafc" text-anchor="middle">Ollama LLM Engine</text>
    <text x="155" y="440" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Llama-3-70B</text>
    <text x="155" y="455" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Qwen2.5-Coder / Vision</text>

    <rect x="260" y="390" width="170" height="90" rx="8" fill="#0f172a" stroke="#38bdf8"/>
    <text x="345" y="420" fill="#f8fafc" text-anchor="middle">Qdrant Vector DB</text>
    <text x="345" y="440" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Local Dense RAG</text>
    <text x="345" y="455" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">BGE-M3 Embeddings</text>

    <rect x="450" y="390" width="170" height="90" rx="8" fill="#0f172a" stroke="#38bdf8"/>
    <text x="535" y="420" fill="#f8fafc" text-anchor="middle">Docker Sandbox</text>
    <text x="535" y="440" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Isolated Container</text>
    <text x="535" y="455" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Memory &amp; Network Bounds</text>

    <rect x="640" y="390" width="190" height="90" rx="8" fill="#0f172a" stroke="#38bdf8"/>
    <text x="735" y="420" fill="#f8fafc" text-anchor="middle">Document &amp; OCR Engine</text>
    <text x="735" y="440" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">PyMuPDF / PaddleOCR</text>
    <text x="735" y="455" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">python-docx / openpyxl</text>

  </g>
</svg>
